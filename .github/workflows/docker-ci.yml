name: Build and Push Modified Services

on:
  push:
    branches: [main, dev, rec]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec'
    outputs:
      apigateway: ${{ steps.filter.outputs.apigateway }}
      client: ${{ steps.filter.outputs.client }}
      database: ${{ steps.filter.outputs.database }}
      oauth: ${{ steps.filter.outputs.oauth }}
      cloudinary: ${{ steps.filter.outputs.cloudinary }}
      mcpserver: ${{ steps.filter.outputs.mcpserver }}
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          if git cat-file -e "${{ github.event.before }}"^{commit} 2>/dev/null; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Files changed:"
          echo "$CHANGED"
          
          echo "apigateway=$(echo "$CHANGED" | grep -q '^MaClasse.ApiGateway/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "client=$(echo "$CHANGED" | grep -q '^MaClasse.Client/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "database=$(echo "$CHANGED" | grep -q '^Service.Database/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "oauth=$(echo "$CHANGED" | grep -q '^Service.OAuth/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "cloudinary=$(echo "$CHANGED" | grep -q '^Service.Cloudinary/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "mcpserver=$(echo "$CHANGED" | grep -q '^Service.MCPServer/' && echo true || echo false)" >> $GITHUB_OUTPUT
          

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
  
  set-docker-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/rec" ]; then
            echo "tag=rec" >> $GITHUB_OUTPUT
          fi
          
  build-apigateway:
    needs: [detect-changes, run-tests, set-docker-tag]
    if: needs.detect-changes.outputs.apigateway == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: | 
          docker build -t ghcr.io/${{ github.repository_owner }}/apigateway:${{ needs.set-docker-tag.outputs.tag }} -f MaClasse.ApiGateway/Dockerfile . --build-arg PROJECT_PATH=MaClasse.ApiGateway
          docker push ghcr.io/${{ github.repository_owner }}/apigateway:${{ needs.set-docker-tag.outputs.tag }}

  build-client:
    needs: [detect-changes, run-tests, set-docker-tag]
    if: needs.detect-changes.outputs.client == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/client:${{ needs.set-docker-tag.outputs.tag }} -f MaClasse.Client/Dockerfile . --build-arg PROJECT_PATH=MaClasse.Client
          docker push ghcr.io/${{ github.repository_owner }}/client:${{ needs.set-docker-tag.outputs.tag }}

  build-database:
    needs: [detect-changes, run-tests, set-docker-tag]
    if: needs.detect-changes.outputs.database == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/database:${{ needs.set-docker-tag.outputs.tag }} -f Service.Database/Dockerfile . --build-arg PROJECT_PATH=Service.Database
          docker push ghcr.io/${{ github.repository_owner }}/database:${{ needs.set-docker-tag.outputs.tag }}

  build-oauth:
    needs: [detect-changes, run-tests, set-docker-tag]
    if: needs.detect-changes.outputs.oauth == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/oauth:${{ needs.set-docker-tag.outputs.tag }} -f Service.OAuth/Dockerfile . --build-arg PROJECT_PATH=Service.OAuth
          docker push ghcr.io/${{ github.repository_owner }}/oauth:${{ needs.set-docker-tag.outputs.tag }}
  
  build-cloudinary:
    needs: [detect-changes, run-tests, set-docker-tag]
    if: needs.detect-changes.outputs.cloudinary == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cloudinary:${{ needs.set-docker-tag.outputs.tag }} -f Service.Cloudinary/Dockerfile . --build-arg PROJECT_PATH=Service.Cloudinary
          docker push ghcr.io/${{ github.repository_owner }}/cloudinary:${{ needs.set-docker-tag.outputs.tag }}
          
  build-mcpserver:
    needs: [detect-changes, run-tests, set-docker-tag]
    if: needs.detect-changes.outputs.mcpserver == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rec')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/mcpserver:${{ needs.set-docker-tag.outputs.tag }} -f Service.MCPServer/Dockerfile . --build-arg PROJECT_PATH=Service.MCPServer
          docker push ghcr.io/${{ github.repository_owner }}/mcpserver:${{ needs.set-docker-tag.outputs.tag }}